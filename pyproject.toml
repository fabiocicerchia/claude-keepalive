[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-keepalive"
description = "Run claude and auto-resume after a usage-limit reset"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/claude-keepalive"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
claude-keepalive = "claude_keepalive:main"

[tool.setuptools]
py-modules = ["claude_keepalive"]

# Read from the one place the version already lives, so a release bump does not
# have to be repeated here and cannot drift from it.
[tool.setuptools.dynamic]
version = { file = "version.txt" }

# The man page rides along in the wheel: `pip install` puts it under
# <prefix>/share/man/man1, which is on the default manpath for a system install
# and for a --user one alike.
[tool.setuptools.data-files]
"share/man/man1" = ["man/claude-keepalive.1"]
